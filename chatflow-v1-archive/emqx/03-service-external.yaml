---
# External service for native MQTT clients (mobile) on port 8883
apiVersion: v1
kind: Service
metadata:
  name: emqx-external
  namespace: chatflow
  labels:
    app: emqx
spec:
  type: LoadBalancer
  selector:
    app: emqx
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: mqtt-wss
      port: 8084
      targetPort: 8084
      protocol: TCP
