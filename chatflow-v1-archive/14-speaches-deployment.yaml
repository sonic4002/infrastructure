# ============================================================================
# Speaches (Whisper) Deployment for Audio Transcription
# ============================================================================
# Provides Hebrew audio transcription using the ivrit-ai/whisper-large-v3-turbo-ct2 model
# via the Speaches API (OpenAI-compatible)
#
# Using TURBO model for 5-8x faster inference on CPU while maintaining Hebrew quality.
# The turbo model (0.8B params) is optimized for speed vs large (1.5B params).
#
# Service: http://speaches-service:8000
# API: POST /v1/audio/transcriptions
#
# Note: Uses emptyDir for model cache (storage quota limited).
# Model will re-download on pod restart.
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: speaches-config
  namespace: chatflow
  labels:
    app.kubernetes.io/name: speaches
data:
  # Default model for Hebrew transcription (turbo for faster CPU inference)
  DEFAULT_MODEL: "ivrit-ai/whisper-large-v3-turbo-ct2"
  # HuggingFace cache directory
  HF_HOME: "/data/huggingface"
  # Whisper cache directory
  WHISPER_CACHE: "/data/whisper"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speaches
  namespace: chatflow
  labels:
    app.kubernetes.io/name: speaches
    app.kubernetes.io/component: transcription
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speaches
  strategy:
    type: Recreate  # Single replica, recreate to avoid PVC conflicts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speaches
        app.kubernetes.io/component: transcription
    spec:
      containers:
        - name: speaches
          # Using faster-whisper-server which uses CTranslate2 (works on CPUs without AVX)
          image: fedirz/faster-whisper-server:latest-cpu
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: WHISPER__MODEL
              value: "ivrit-ai/whisper-large-v3-turbo-ct2"
            - name: WHISPER__COMPUTE_TYPE
              value: "int8"
            - name: WHISPER__DEVICE
              value: "cpu"
          resources:
            # Turbo model (0.8B params) uses less memory than large (1.5B params)
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # Allow up to 5 minutes for model download
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 5Gi
      # Run on nodes with sufficient memory
      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: speaches-service
  namespace: chatflow
  labels:
    app.kubernetes.io/name: speaches
    app.kubernetes.io/component: transcription
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: speaches
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# Job to pre-load the Hebrew model on first deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: speaches-preload-model
  namespace: chatflow
  labels:
    app.kubernetes.io/name: speaches
    app.kubernetes.io/component: init
spec:
  ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: preload
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Speaches service to be ready..."
              sleep 60
              echo "Pre-loading Hebrew turbo model..."
              curl -X POST "http://speaches-service:8000/v1/audio/transcriptions" \
                -H "Content-Type: multipart/form-data" \
                -F "model=ivrit-ai/whisper-large-v3-turbo-ct2" \
                -F "file=@/dev/null" || true
              echo "Model preload request sent"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
