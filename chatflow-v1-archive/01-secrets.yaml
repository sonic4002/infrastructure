---
################################################################################
# Secrets for ChatFlow Namespace
################################################################################
# IMPORTANT: This file contains PLACEHOLDER values for secrets.
# Before applying, replace placeholders with real base64-encoded values from
# the live cluster or your secret management system.
#
# To extract the current dockerhub-secret value from a running cluster:
#   kubectl get secret dockerhub-secret -n chatflow -o jsonpath='{.data.\.dockerconfigjson}'
#
# To extract orchestrator-db-secret values:
#   kubectl get secret orchestrator-db-secret -n chatflow -o jsonpath='{.data}'
#
################################################################################

# Docker Hub image pull secret - required by orchestrator, wa-client pods,
# and chatflow-web to pull images from sonic4002/digital_solutions
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: chatflow
  labels:
    app.kubernetes.io/name: whatsapp-microservice
    app.kubernetes.io/part-of: chatflow
    app.kubernetes.io/managed-by: kubectl
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsiYXV0aCI6ImMyOXVhV00wTURBeU9tUmphM0pmY0dGMFgwZFRiMVpsWDFFNVkwZ3dSMlZxYUhJNFdWcDJUMDh5WmpGc2N3PT0ifX19Cg==

