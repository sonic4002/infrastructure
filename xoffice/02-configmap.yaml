apiVersion: v1
kind: ConfigMap
metadata:
  name: xoffice-config
  namespace: xoffice
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  INVITE_OTP_DEBUG: "true"
  # CORS_ORIGINS is in the secret (xoffice-secrets) with the full list
  NEXT_PUBLIC_API_URL: "https://api.xoffice.cloud"
  API_URL: "https://api.xoffice.cloud"
  # The Customer portal's origin. The backend writes Portal invitation and
  # Portal user password-reset links against it, and refuses a staff token
  # arriving from it (and a portal token arriving from FRONTEND_URL).
  # It must also be listed in CORS_ORIGINS (in the secret).
  PORTAL_FRONTEND_URL: "https://customer.xoffice.cloud"
  # The customer staff clock's origin (personal clock /{locale}/c/{token} and
  # kiosk /{locale}/k/{token}). The backend builds every clock and kiosk link on
  # it, accepts push-device registrations only from it, and adds it to the CORS
  # origins. Gate: the host must be live (DNS, Full (Strict), Origin CA) before
  # the first real link, because device keys, passkeys and push subscriptions
  # are bound to the origin.
  # Not set at the first release (2026-10-24): clock and kiosk links are served
  # from PORTAL_FRONTEND_URL until clock.xoffice.cloud passes the gate above.
  # CLOCK_FRONTEND_URL: "https://clock.xoffice.cloud"
  # Reminders engine source modes (source:mode pairs; live | dry_run | off).
  # attendance:dry_run for the first production week: deliveries are written to
  # the alert log but nothing is sent. Then remove this line (live). An unknown
  # source or mode fails the reminder worker's start-up.
  REMINDER_SOURCE_MODES: "attendance:dry_run"
  # SUMIT billing (xoffice specs/billing). SUMIT_COMPANY_ID and SUMIT_API_KEY are
  # in xoffice-secrets (envFrom). The four fixed SUMIT payment pages are public
  # URLs, not secrets: Keren's production business. A page left empty, or missing
  # API keys, makes POST /billing/checkouts return 503 billing_unavailable, while
  # the trial, the lock and the guard still apply. The MONTHLY and PORTAL_USER
  # pages must sell a recurring product (standing order) in SUMIT; the link's last
  # segment is the product, so after changing a page's product copy its new link.
  # Each page's success URL in SUMIT is https://xoffice.cloud/he/billing/return.
  # Production pages live in this ConfigMap, not in the Secret: this ConfigMap
  # is listed after the Secret in envFrom, so its values would win.
  SUMIT_PAGE_MONTHLY: "https://pay.sumit.co.il/14qzgkp/15sb0v2/15sb0v3/payment/"
  SUMIT_PAGE_HALF_YEAR: "https://pay.sumit.co.il/14qzgkp/15s6fxc/15s6fxd/payment/"
  SUMIT_PAGE_YEARLY: "https://pay.sumit.co.il/14qzgkp/15s7ltu/15s7ltv/payment/"
  SUMIT_PAGE_PORTAL_USER: "https://pay.sumit.co.il/14qzgkp/15sjld3/15sjld4/payment/"
  # Who is emailed about unmatched payments, failed panel charges and open refunds.
  BILLING_ALERT_EMAILS: "omrihaviv@gmail.com,kerenaxelrod@gmail.com"
  # ChatFlow v2 integration (present in the live ConfigMap; kept here so an apply
  # does not delete it)
  CHATFLOW_V2_ENABLED: "true"
  # MQTT Integration (cross-service notifications via EMQX)
  # Disabled: the broker has never accepted a connection from this service, so the
  # client only ever produced a 60s reconnect-failure loop. Task sync falls back to
  # REST (MQTT_TASK_SYNC_ONLY is false). Flip back to "true" when EMQX is reachable.
  MQTT_ENABLED: "false"
  MQTT_BROKER_URL: "tcp://emqx-service.chatflow.svc.cluster.local:1883"
  MQTT_CLIENT_ID: "xoffice-backend"
  # Web Push VAPID (public key is not sensitive).
  # Left unset on purpose: an empty vapid_public_key is the flag that keeps web push
  # cleanly disabled (see push_subscriptions.py and push_subscription_service.py).
  # Shipping the placeholder string would satisfy those guards and hand the browser an
  # invalid key, so uncomment only together with VAPID_PRIVATE_KEY in xoffice-secrets.
  # Human gate (owner only, before the first real clock link): generate a fresh
  # P-256 key pair (do not reuse the old local entry), private key into
  # infrastructure/secrets/xoffice/, public key here, then ./scripts/sync-to-ice.sh.
  # Until then the clock page hides its push toggle and alert plans are skipped
  # as unavailable; the same keys also turn on Customer portal push.
  # VAPID_PUBLIC_KEY: "<generated-public-key>"
  # VAPID_CONTACT_EMAIL: "mailto:admin@xoffice.cloud"
