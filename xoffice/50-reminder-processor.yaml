apiVersion: apps/v1
kind: Deployment
metadata:
  name: xoffice-reminder-worker
  namespace: xoffice
  labels:
    app: xoffice-reminder-worker
    app.kubernetes.io/name: xoffice
    app.kubernetes.io/component: reminder-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xoffice-reminder-worker
  template:
    metadata:
      labels:
        app: xoffice-reminder-worker
        app.kubernetes.io/name: xoffice
        app.kubernetes.io/component: reminder-worker
    spec:
      containers:
        - name: reminder-worker
          image: sonic4002/digital_solutions:xoffice-backend-v283
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.services.reminder_worker
          envFrom:
            # xoffice-secrets carries SUMIT_COMPANY_ID and SUMIT_API_KEY (billing),
            # like every other credential. Until the owner adds them, checkouts
            # return 503 billing_unavailable and the reconciler skips SUMIT.
            - secretRef:
                name: xoffice-secrets
            - configMapRef:
                name: xoffice-config
          # Two loops in one pod: the legacy loop (user reminders, pollers) every
          # WORKER_POLL_INTERVAL_SECONDS, and the reminders engine loop (system
          # reminders and jobs, e.g. customer staff attendance) every
          # REMINDER_ENGINE_POLL_SECONDS. /tmp/heartbeat is touched only while both
          # loops have completed a pass in the last 90 s, so the liveness probe
          # below restarts the pod when either one hangs.
          # replicas 1 + Recreate stay: the legacy loop is not claim-safe.
          env:
            - name: WORKER_POLL_INTERVAL_SECONDS
              value: "30"
            - name: REMINDER_ENGINE_POLL_SECONDS
              value: "15"
          # Raised for the engine loop (up to 20 concurrent deliveries and 4 jobs).
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<120"
            initialDelaySeconds: 45
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
