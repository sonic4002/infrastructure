apiVersion: apps/v1
kind: Deployment
metadata:
  name: xoffice-frontend
  namespace: xoffice
  labels:
    app: xoffice-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xoffice-frontend
  template:
    metadata:
      labels:
        app: xoffice-frontend
    spec:
      containers:
        - name: frontend
          image: sonic4002/digital_solutions:xoffice-frontend-v265
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: xoffice-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: xoffice-frontend-service
  namespace: xoffice
spec:
  selector:
    app: xoffice-frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xoffice-frontend-hpa
  namespace: xoffice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xoffice-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
