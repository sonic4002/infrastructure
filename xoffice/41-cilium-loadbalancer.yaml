# NodePort services for direct access on single-node cluster
apiVersion: v1
kind: Service
metadata:
  name: xoffice-frontend-nodeport
  namespace: xoffice
spec:
  type: NodePort
  selector:
    app: xoffice-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: xoffice-backend-nodeport
  namespace: xoffice
spec:
  type: NodePort
  selector:
    app: xoffice-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30081
