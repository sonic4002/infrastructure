---
################################################################################
# Consolidated Cilium Gateway - Single LB IP for all platform traffic
#
# Namespace: gateway (shared infrastructure)
# TLS: Cloudflare terminates at the edge. All listeners are HTTP/80.
#   chatflowpro.live: Flexible (HTTP to origin).
#   xoffice.cloud: Full (HTTPS to origin :443, self-signed certificate,
#   unwrapped by common/02-tls-terminator.yaml); see the TLS note in
#   xoffice/50-gateway-httproutes.yaml for the Full (Strict) gate.
#
# Domains:
#   chatflow:  api.chatflowpro.live, chatflowpro.live, mqtt.chatflowpro.live
#   xoffice:   xoffice.cloud, api.xoffice.cloud, customer.xoffice.cloud,
#              clock.xoffice.cloud
#
# HTTPRoutes live in their respective app namespaces (chatflow, xoffice).
# Each listener uses a namespace selector to control which namespaces can
# attach routes.
################################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: cilium
spec:
  gatewayClassName: cilium

  listeners:
    # =========================================================================
    # CHATFLOW (namespace: chatflow)
    # =========================================================================

    - name: chatflow-api
      protocol: HTTP
      port: 80
      hostname: "api.chatflowpro.live"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: chatflow

    - name: chatflow-web
      protocol: HTTP
      port: 80
      hostname: "chatflowpro.live"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: chatflow

    - name: chatflow-mqtt
      protocol: HTTP
      port: 80
      hostname: "mqtt.chatflowpro.live"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: chatflow

    # =========================================================================
    # XOFFICE (namespace: xoffice)
    # =========================================================================

    - name: xoffice-frontend
      protocol: HTTP
      port: 80
      hostname: "xoffice.cloud"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/name: xoffice

    - name: xoffice-api
      protocol: HTTP
      port: 80
      hostname: "api.xoffice.cloud"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/name: xoffice

    # The Customer portal: the same xoffice frontend, which serves portal mode
    # when it is reached on this host (one image, no separate deployment). It
    # talks to the same api.xoffice.cloud as the staff host.
    - name: xoffice-customer-portal
      protocol: HTTP
      port: 80
      hostname: "customer.xoffice.cloud"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/name: xoffice

    # The customer staff clock: the same xoffice frontend, which serves only
    # the personal clock (/{locale}/c/*), the kiosk (/{locale}/k/*), the
    # manifest and the legal pages on this host. Its own origin, because device
    # keys, passkeys and push subscriptions are bound to it.
    - name: xoffice-clock
      protocol: HTTP
      port: 80
      hostname: "clock.xoffice.cloud"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/name: xoffice
