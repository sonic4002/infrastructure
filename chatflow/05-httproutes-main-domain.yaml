---
################################################################################
# HTTPRoute: chatflowpro.live
#
# Replaces: 16-chatflow-ingress.yaml (apex block) + whatsapp_v2_web/k8s/02-ingress.yaml
#
# Priority:
#   1. /delete-account                (exact)  -> orchestrator (Google Play)
#   2. /api/v1/account/delete-request (exact)  -> orchestrator (Google Play)
#   3. /health                        (exact)  -> orchestrator (LB probe)
#   4. /healthz                       (exact)  -> chatflow-web (container health)
#   5. /                              (prefix) -> Flutter SPA (catch-all)
################################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: main-route
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow-gateway
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway
      sectionName: chatflow-web
  hostnames:
    - "chatflowpro.live"

  rules:
    - matches:
        - path:
            type: Exact
            value: /delete-account
      backendRefs:
        - name: orchestrator-service
          port: 8080

    - matches:
        - path:
            type: Exact
            value: /api/v1/account/delete-request
          method: POST
      backendRefs:
        - name: orchestrator-service
          port: 8080
      timeouts:
        request: "30s"

    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: orchestrator-service
          port: 8080

    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: chatflow-web-service
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chatflow-web-service
          port: 80
      timeouts:
        request: "30s"
