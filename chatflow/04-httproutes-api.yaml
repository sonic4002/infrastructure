---
################################################################################
# HTTPRoute: api.chatflowpro.live
#
# Replaces: 16-chatflow-ingress.yaml (api block) + 07-httproute.yaml
#
# Route priority (first match wins):
#   1. /health            (exact)  - health probe
#   2. /ready             (exact)  - readiness probe
#   3. /metrics           (exact)  - Prometheus scrape
#   4. /api/v1/users/*/ws (prefix + Upgrade header) - WebSocket, no timeout
#   5. /api/v1/           (prefix) - REST API, 30s timeout
#   6. /internal/         (prefix) - client-pod callbacks
#   7. /                  (catch-all)
################################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow-gateway
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway
      sectionName: chatflow-api
  hostnames:
    - "api.chatflowpro.live"

  rules:
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: orchestrator-service
          port: 8080

    - matches:
        - path:
            type: Exact
            value: /ready
      backendRefs:
        - name: orchestrator-service
          port: 8080

    - matches:
        - path:
            type: Exact
            value: /metrics
      backendRefs:
        - name: orchestrator-service
          port: 8080

    # WebSocket - unlimited timeout for persistent connections
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/users/
          headers:
            - name: Upgrade
              value: websocket
      backendRefs:
        - name: orchestrator-service
          port: 8080
      timeouts:
        request: "0s"
        backendRequest: "0s"

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/
      backendRefs:
        - name: orchestrator-service
          port: 8080
      timeouts:
        request: "30s"

    - matches:
        - path:
            type: PathPrefix
            value: /internal/
      backendRefs:
        - name: orchestrator-service
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orchestrator-service
          port: 8080
      timeouts:
        request: "30s"
