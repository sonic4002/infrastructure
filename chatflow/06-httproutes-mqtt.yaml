---
################################################################################
# HTTPRoute: mqtt.chatflowpro.live (MQTT-over-WebSocket)
#
# Replaces: k8s/emqx/07-ingress.yaml + k8s/emqx/04-gateway-route.yaml
#
# Traffic: Client --WS--> Gateway :80 --WS--> EMQX :8083/mqtt
#
# timeout "0s" = no deadline for persistent MQTT WebSocket connections.
# Raw MQTT-over-TCP (1883/8883/8084) goes via emqx-external LB, unchanged.
################################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mqtt-route
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow-gateway
    app.kubernetes.io/component: routing
    app: emqx
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway
      sectionName: chatflow-mqtt
  hostnames:
    - "mqtt.chatflowpro.live"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mqtt
      backendRefs:
        - name: emqx-service
          port: 8083
      timeouts:
        request: "0s"
        backendRequest: "0s"
