---
################################################################################
# EMQX 5.8.5 — Phase 2 cutover STAGE B (JWT-only authn, final state)
#
# Applied at cutover step 4d, AFTER step 4c verifies Stage A traffic is clean.
# Differences from Stage A (04-emqx-stageA.yaml):
#   - authentication chain reduced to [jwt] (built_in_database removed).
#   - bootstrap-users init container DELETED.
#   - chatflow-mqtt-credentials secret no longer needed by EMQX (NODE_COOKIE
#     and DASHBOARD_PASSWORD only — POD/CLIENT user/password keys unused).
#
# CUTOVER PRE-STEP (REQUIRED — see runbook in docs/whatsapp_v2/infrastructure.md):
#   EMQX dashboard authn writes go to data/configs/cluster.hocon, which
#   overrides the ConfigMap on restart. Wipe it before applying this manifest:
#
#     kubectl exec -n chatflow sts/emqx -- sh -c \
#       '[ -f /opt/emqx/data/configs/cluster.hocon ] && \
#        rm /opt/emqx/data/configs/cluster.hocon || true'
#
# After apply, restart the StatefulSet so the chain change takes effect:
#     kubectl rollout restart -n chatflow statefulset/emqx
################################################################################

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emqx-config
  namespace: chatflow
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chatflow
data:
  emqx.conf: |
    node {
      cookie = "${EMQX_NODE_COOKIE}"
      data_dir = "/opt/emqx/data"
    }

    cluster {
      discovery_strategy = dns
      dns {
        record_type = srv
        name = "emqx-headless.chatflow.svc.cluster.local"
      }
    }

    listeners.tcp.default {
      bind = "0.0.0.0:1883"
      max_connections = 10000
    }

    listeners.ws.default {
      bind = "0.0.0.0:8083"
      max_connections = 50000
      websocket {
        mqtt_path = "/mqtt"
      }
    }

    listeners.ssl.default {
      bind = "0.0.0.0:8883"
      max_connections = 50000
      enable = false
    }

    listeners.wss.default {
      bind = "0.0.0.0:8084"
      enable = false
    }

    ##########################################################################
    # Authentication (Stage B): JWT only. Legacy fall-through removed.
    ##########################################################################
    authentication = [
      {
        mechanism = jwt
        use_jwks = true
        endpoint = "http://auth-service.chatflow.svc.cluster.local:8080/.well-known/jwks.json"
        refresh_interval = 30
        verify_claims = {
          aud = "chatflow-emqx"
          sub = "${username}"
        }
        from = password
        leeway = 30
      }
    ]

    mqtt {
      client_attrs_init = [
        { expression = "username",                       set_as_attr = "user_id" },
        { expression = "nth(2, tokens(clientid, ':'))",  set_as_attr = "device_id" }
      ]
      max_inflight = 100
      max_packet_size = "256KB"
      idle_timeout = "60s"
      max_topic_alias = 65535
      retry_interval = "30s"
      session_expiry_interval = 7d
      max_mqueue_len = 50000
      mqueue.store_qos0 = false
    }

    authorization {
      no_match = deny
      deny_action = disconnect
      sources = [
        { type = file, enable = true, path = "etc/acl.conf" }
      ]
    }

    retainer {
      enable = true
      max_payload_size = "16KB"
      msg_expiry_interval = "24h"
      flow_control { batch_deliver_number = 100 }
    }

    dashboard {
      listeners.http {
        bind = "0.0.0.0:18083"
      }
      default_username = "admin"
      default_password = "${EMQX_DASHBOARD_DEFAULT_PASSWORD}"
    }

    # NEVER set to debug in prod — CONNECT packets log JWT passwords at debug.
    log.console.level = info

  acl.conf: |
    %% Web user
    {allow, {clientid, {re, "^web:.+"}}, subscribe,
      ["chatflow/${client_attrs.user_id}/+/+",
       "chatflow/${client_attrs.user_id}/handshake"]}.
    {allow, {clientid, {re, "^web:.+"}}, publish,
      ["chatflow/${client_attrs.user_id}/cmd/${client_attrs.device_id}"]}.

    %% Pod (publish only)
    {allow, {clientid, {re, "^pod:.+"}}, publish,
      ["chatflow/${client_attrs.user_id}/+/+",
       "chatflow/${client_attrs.user_id}/handshake"]}.

    {deny, all}.

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: chatflow
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chatflow
spec:
  serviceName: emqx-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: chatflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # bootstrap-users init container removed in stage B (legacy creds gone).
      containers:
        - name: emqx
          image: emqx/emqx:5.8.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: mqtt-tcp,    containerPort: 1883,  protocol: TCP }
            - { name: mqtt-ws,     containerPort: 8083,  protocol: TCP }
            - { name: mqtt-wss,    containerPort: 8084,  protocol: TCP }
            - { name: mqtts,       containerPort: 8883,  protocol: TCP }
            - { name: dashboard,   containerPort: 18083, protocol: TCP }
            - { name: cluster-rpc, containerPort: 5369,  protocol: TCP }
            - { name: cluster-ekk, containerPort: 4370,  protocol: TCP }
          env:
            - name: EMQX_NAME
              value: emqx
            - name: EMQX_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EMQX_NODE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: chatflow-mqtt-credentials
                  key: NODE_COOKIE
            - name: EMQX_DASHBOARD_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatflow-mqtt-credentials
                  key: DASHBOARD_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /status
              port: 18083
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 18083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - { name: emqx-data,   mountPath: /opt/emqx/data }
            - { name: emqx-config, mountPath: /opt/emqx/etc/emqx.conf, subPath: emqx.conf }
            - { name: emqx-config, mountPath: /opt/emqx/etc/acl.conf,  subPath: acl.conf }
      volumes:
        - name: emqx-config
          configMap:
            name: emqx-config
  volumeClaimTemplates:
    - metadata:
        name: emqx-data
        labels:
          app.kubernetes.io/name: emqx
          app.kubernetes.io/component: broker
          app.kubernetes.io/part-of: chatflow
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: chatflow
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chatflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
  ports:
    - { name: mqtt-tcp,    port: 1883,  targetPort: 1883 }
    - { name: mqtt-ws,     port: 8083,  targetPort: 8083 }
    - { name: cluster-rpc, port: 5369,  targetPort: 5369 }
    - { name: cluster-ekk, port: 4370,  targetPort: 4370 }

---
apiVersion: v1
kind: Service
metadata:
  name: emqx-service
  namespace: chatflow
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chatflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
  ports:
    - { name: mqtt-tcp, port: 1883, targetPort: 1883 }
    - { name: mqtt-ws,  port: 8083, targetPort: 8083 }
    - { name: dashboard, port: 18083, targetPort: 18083 }
