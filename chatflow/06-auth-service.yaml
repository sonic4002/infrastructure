---
################################################################################
# Auth Service — phone OTP, JWT issuance, JWKS publication
#
# Public endpoints (via api.chatflowpro.live HTTPRoute -> /auth/*):
#   POST /auth/otp/request   { phone }
#   POST /auth/otp/verify    { phone, code, device_info }
#   POST /auth/refresh       { refresh_token }
#   POST /auth/logout
#   GET  /.well-known/jwks.json    (also fetched in-cluster by EMQX, gateway)
#
# Image is TODO — Phase 1 ROADMAP includes building chatflow-auth.
################################################################################

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: chatflow
automountServiceAccountToken: true   # needed for the projected openbao token below

---
# Phase 2 task 10: pod-JWT issuance trust chain.
#
# /internal/pod-jwt validates submitted ServiceAccount tokens via
# TokenReview (cluster-scoped subresource) and reads the chatflow.io/user-id
# annotation off the SA via a SA GET (namespace-scoped). The TokenReview
# verb is granted at cluster scope because the API itself is cluster-scoped;
# SA GET is granted only within the chatflow namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chatflow-auth-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chatflow-auth-tokenreview
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: chatflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chatflow-auth-tokenreview

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatflow-auth-sa-reader
  namespace: chatflow
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatflow-auth-sa-reader
  namespace: chatflow
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: chatflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatflow-auth-sa-reader

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: chatflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chatflow
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatflow
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: chatflow
    spec:
      serviceAccountName: auth-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: docker.io/sonic4002/digital_solutions:chatflow-auth-latest    # TODO: build + pin to digest
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DB_HOST
              value: "postgres-service.chatflow.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: AUTH_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: AUTH_DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: AUTH_DB_NAME } }
            - name: TWILIO_ACCOUNT_SID
              valueFrom: { secretKeyRef: { name: twilio-secret, key: TWILIO_ACCOUNT_SID } }
            - name: TWILIO_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: twilio-secret, key: TWILIO_AUTH_TOKEN } }
            - name: TWILIO_FROM_NUMBER
              valueFrom: { secretKeyRef: { name: twilio-secret, key: TWILIO_FROM_NUMBER } }
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/chatflow/jwt/jwt-private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/chatflow/jwt/jwt-public.pem
            - name: JWT_KID
              valueFrom: { secretKeyRef: { name: auth-jwt-keypair, key: kid } }
            - name: JWT_ISSUER
              value: "https://api.chatflowpro.live/auth"
            - name: JWT_ACCESS_TTL
              value: "15m"
            - name: JWT_REFRESH_TTL
              value: "720h"   # 30 days
            - name: OPENBAO_ADDR
              value: "http://openbao-service.chatflow.svc.cluster.local:8200"
            - name: OPENBAO_K8S_ROLE
              value: "auth-service"
            # Phase 2: kickout flow needs EMQX dashboard API key. Until that
            # is provisioned (see docs/whatsapp_v2/infrastructure.md "EMQX
            # management API key provisioning"), opt out of the startup
            # gate so the service can boot. Device revocation will revoke at
            # the storage layer (device_keys + refresh_tokens) but won't
            # immediately disconnect the active MQTT session — eviction
            # happens at next JWT expiry instead.
            - name: KICKOUT_REQUIRED
              value: "false"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: jwt-keys,      mountPath: /etc/chatflow/jwt, readOnly: true }
            - { name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true }
            - { name: tmp,           mountPath: /tmp }
      volumes:
        - name: jwt-keys
          secret:
            secretName: auth-jwt-keypair
            items:
              - { key: jwt-private.pem, path: jwt-private.pem }
              - { key: jwt-public.pem,  path: jwt-public.pem }
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: openbao
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: chatflow
  labels:
    app.kubernetes.io/name: chatflow
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: chatflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatflow
    app.kubernetes.io/component: auth
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
